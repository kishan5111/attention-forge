[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attention-forge"
version = "0.1.0"
description = "A from-scratch lab for learning, visualizing, and benchmarking modern LLM attention mechanisms."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Attention Forge contributors" },
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
notebooks = [
  "jupyter>=1.0",
  "plotly>=5.20",
]
visuals = [
  "manim>=0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["attention_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
